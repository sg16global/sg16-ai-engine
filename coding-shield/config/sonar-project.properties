# SonarQube / SonarCloud scanner config for SG16 Coding Shield
sonar.projectKey=sg16-coding-shield
sonar.projectName=SG16 Coding Shield
sonar.projectVersion=1.0

sonar.sources=backend/lib,project/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/backend/public/**,**/project/android/**,coding-shield/**

sonar.javascript.lcov.reportPaths=coding-shield/reports/coverage/lcov.info
sonar.eslint.reportPaths=coding-shield/reports/eslint.json

# Set at scan time:
# sonar.host.url=https://sonarcloud.io
# sonar.organization=YOUR_ORG
# sonar.token=from SONAR_TOKEN env
