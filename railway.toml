[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.envVars]
NODE_ENV = "production"
SG16_BRAIN = "ollama"
OLLAMA_URL = "http://127.0.0.1:11434"
SG16_OLLAMA_MODEL = "mistral:7b-instruct-q4_K_M"
SG16_CHAT_TIMEOUT_MS = "90000"
SG16_CODING_TIMEOUT_MS = "90000"
SG16_OLLAMA_MAX_TOKENS = "384"
SG16_OLLAMA_TIMEOUT_MS = "90000"
SG16_EDGE_TIMEOUT_MS = "90000"
HOST = "0.0.0.0"
OLLAMA_KEEP_ALIVE = "24h"
OLLAMA_MAX_LOADED_MODELS = "1"
OLLAMA_NUM_PARALLEL = "1"
OLLAMA_NUM_CTX = "1024"
OLLAMA_NUM_THREAD = "4"
SG16_CHILDREN_ENABLED = "1"
SG16_CHILDREN_ORIGINS = "https://sg16children.com,https://www.sg16children.com"
SG16_SOVEREIGN_FALLBACK = "1"
