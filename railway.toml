[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.envVars]
NODE_ENV = "production"
# SG16 Mistral X — single cloud brain (no Ollama, no Groq)
SG16_BRAIN = "mistralbrain"
MISTRAL_BRAIN_URL = "https://api.mistralbrain.com"
# Set in Railway secrets (NOT here): MISTRAL_BRAIN_KEY
SG16_SOVEREIGN_FALLBACK = "0"
SG16_CHILDREN_ENABLED = "1"
SG16_CHAT_TIMEOUT_MS = "90000"
SG16_CODING_TIMEOUT_MS = "90000"
HOST = "0.0.0.0"
