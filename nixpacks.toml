# Install Semgrep + Gitleaks on Railway (Linux build image).
# Keep nodejs in setup — overriding nixPkgs replaces Nixpacks defaults.
[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip", "curl", "gnugrep"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "pip install semgrep --break-system-packages || pip install semgrep || true",
  "curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks || true",
  "chmod +x /usr/local/bin/gitleaks || true"
]
