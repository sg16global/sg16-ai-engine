# Builds the website and the backend container and deploys both to Cloudflare
# (Worker "sg16-engine-web"). Runs on every push to main, or by hand from the Actions tab.
# GitHub's runner provides Docker, which wrangler needs to build the container image.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 3676a09b6ca7c6fb929833cb2e4d69f6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret (repo Settings → Secrets and variables → Actions). See cloudflare/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Build website
        run: |
          npm ci --prefix project
          npm run build --prefix project

      # Wrangler needs Node 22+; the site itself still builds on the project's Node version above.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy website + backend container
        working-directory: cloudflare
        run: |
          npm ci
          npx wrangler deploy
