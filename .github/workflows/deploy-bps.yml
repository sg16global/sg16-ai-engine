# Deploy SG16 to your sovereign VPS (Google / Contabo / home PC).
# GitHub repo → Settings → Secrets:
#   BPS_HOST     = VM external IP or hostname
#   BPS_SSH_KEY  = private key (PEM) for SSH user
#   BPS_SSH_USER = optional, default sg16 or your sudo user
name: Deploy SG16 BPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: false
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BPS_HOST }}
          username: ${{ secrets.BPS_SSH_USER || 'sg16' }}
          key: ${{ secrets.BPS_SSH_KEY }}
          script_stop: true
          script: |
            export SG16_BRANCH="${{ github.event.inputs.branch || 'main' }}"
            export SG16_APP=/opt/sg16/app
            export SG16_HOME=/opt/sg16
            if [[ -x "${SG16_APP}/sg16-bps/deploy.sh" ]]; then
              sudo SG16_BRANCH="$SG16_BRANCH" bash "${SG16_APP}/sg16-bps/deploy.sh"
            else
              echo "Run sg16-bps/bootstrap.sh on the server first."
              exit 1
            fi
